name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - maintenance/post-BF-1054-repository-review

  pull_request:
    branches:
      - main
      - develop
      - maintenance/post-BF-1054-repository-review

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-validate:
    name: Optional Linux Compatibility
    runs-on: ubuntu-latest
    # B11-D3: compatibility signal only; Windows x64 is the sole v1 target.
    continue-on-error: true
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      NUGET_XMLDOC_MODE: skip
      CONFIGURATION: Release
      SOLUTION_PATH: ./PiratePDF.slnx
      DOCGEN_PROJECT_PATH: ./tools/PiratePDF.DocGen/PiratePDF.DocGen.csproj
      DOCGEN_DLL_PATH: ./tools/PiratePDF.DocGen/bin/Release/net10.0/PiratePDF.DocGen.dll

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.403"

      - name: Install SkiaSharp dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 libfreetype6 libharfbuzz0b

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build solution
        run: >
          dotnet build "$SOLUTION_PATH"
          --configuration "$CONFIGURATION"
          --no-restore

      - name: Run portable tests
        run: >
          dotnet test "$SOLUTION_PATH"
          --configuration "$CONFIGURATION"
          --no-build
          --no-restore
          --filter "Platform!=Windows"
          --results-directory ./TestResults/portable
          --logger trx
          --logger "console;verbosity=normal"

      - name: Verify portable fuzz test coverage
        shell: pwsh
        run: ./tests/PiratePDF.Fuzz.Tests/Test-PlatformCoverage.ps1 -ResultsDirectory ./TestResults/portable -Platform Portable

      - name: Bound failed test-result evidence
        id: portable_trx_bounds
        if: failure()
        shell: pwsh
        run: ./tests/PiratePDF.Fuzz.Tests/Test-PlatformCoverage.ps1 -ResultsDirectory ./TestResults/portable -BoundsOnly

      - name: Retain failed test results
        if: failure() && steps.portable_trx_bounds.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: portable-test-results
          path: TestResults/portable/*.trx
          retention-days: 7
          if-no-files-found: warn

      - name: Build DocGen Release artifact
        run: >
          dotnet build "$DOCGEN_PROJECT_PATH"
          --configuration "$CONFIGURATION"
          --no-restore

      - name: Verify DocGen build artifact
        shell: bash
        run: |
          if [[ ! -f "$DOCGEN_DLL_PATH" ]]; then
            echo "::error::DocGen Release artifact was not produced at $DOCGEN_DLL_PATH"
            exit 1
          fi

          echo "DocGen artifact found: $DOCGEN_DLL_PATH"

      - name: Generate documentation index and validate
        run: dotnet "$DOCGEN_DLL_PATH" all

      - name: Analyze documentation health
        run: dotnet "$DOCGEN_DLL_PATH" health

      - name: Verify no documentation repairs are required
        run: dotnet "$DOCGEN_DLL_PATH" repair

      - name: Verify tracked generated files are current
        shell: bash
        run: |
          if ! git diff --quiet --exit-code; then
            echo "::error::Tracked generated files are out of date."
            echo
            echo "Run these commands locally and commit the resulting changes:"
            echo "  dotnet restore ./PiratePDF.slnx"
            echo "  dotnet build ./PiratePDF.slnx --configuration Release --no-restore"
            echo "  dotnet build ./tools/PiratePDF.DocGen/PiratePDF.DocGen.csproj --configuration Release --no-restore"
            echo "  dotnet ./tools/PiratePDF.DocGen/bin/Release/net10.0/PiratePDF.DocGen.dll all"
            echo "  dotnet ./tools/PiratePDF.DocGen/bin/Release/net10.0/PiratePDF.DocGen.dll health"
            echo "  dotnet ./tools/PiratePDF.DocGen/bin/Release/net10.0/PiratePDF.DocGen.dll repair"
            echo
            git diff --stat
            echo
            git diff
            exit 1
          fi

          echo "Tracked generated files are current."

      - name: Verify no unexpected files were generated
        shell: bash
        run: |
          unexpected_files="$(git ls-files --others --exclude-standard)"

          if [[ -n "$unexpected_files" ]]; then
            echo "::error::CI generated unexpected untracked files."
            echo "$unexpected_files"
            exit 1
          fi

          echo "No unexpected untracked files were generated."

      - name: Verify repository formatting
        shell: bash
        run: |
          if ! git diff --check; then
            echo "::error::Whitespace or formatting errors were detected."
            exit 1
          fi

          echo "No whitespace errors were detected."

  windows-fuzz-contracts:
    name: Windows Build and Test
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      NUGET_XMLDOC_MODE: skip
      CONFIGURATION: Release
      SOLUTION_PATH: ./PiratePDF.slnx

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.403"

      - name: Restore dependencies
        run: dotnet restore "$env:SOLUTION_PATH"

      - name: Restore separately scoped managed-fuzz dependencies
        run: |
          dotnet restore ./tools/PiratePDF.Fuzz.SharpFuzz/PiratePDF.Fuzz.SharpFuzz.csproj --runtime win-x64 --locked-mode --configfile ./tools/dependencies/NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'Locked tooling restore failed.' }

      - name: Verify dependency inventory and SBOMs
        # Match the PowerShell 7 JSON serialization used for reviewed B14B artifacts.
        shell: pwsh
        run: |
          ./tools/dependencies/Build-ServicedSbomTool.ps1 -OutputDirectory ./artifacts/fuzz/b12-ci-tools-serviced
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source-serviced SBOM tool build failed.' }
          ./tools/dependencies/Export-DependencyInventory.ps1 -OutputDirectory ./docs/dependencies
          ./tools/dependencies/Export-Sbom.ps1 -CycloneDxPath ./artifacts/fuzz/b12-ci-tools-serviced/publish-1/CycloneDX.exe -OutputDirectory ./docs/dependencies
          ./tools/dependencies/Test-DependencyPipeline.ps1 -EvidenceDirectory ./artifacts/fuzz/b12-ci-evidence
          git diff --exit-code -- ./docs/dependencies
          if ($LASTEXITCODE -ne 0) { throw 'Dependency evidence drifted; regenerate and review.' }
          # B15: prevent generated notice whitespace regressions independently of
          # artifact hashes and preserve the historical B12 snapshot unchanged.
          $notices = [IO.File]::ReadAllText((Join-Path (Get-Location).Path 'docs/dependencies/THIRD-PARTY-NOTICES.txt'))
          if (-not $notices.EndsWith("`n") -or $notices.EndsWith("`n`n") -or $notices -match '[ \t]+\r?\n') {
            throw 'Generated third-party notices contain trailing whitespace or an invalid final newline.'
          }

      - name: Retain dependency accountability artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-accountability
          path: |
            docs/dependencies/*.json
            docs/dependencies/*.xml
            docs/dependencies/THIRD-PARTY-NOTICES.txt
            docs/dependencies/licenses/*.txt
            docs/dependencies/evidence/*.txt
          retention-days: 7
          if-no-files-found: error

      - name: Build solution
        run: dotnet build "$env:SOLUTION_PATH" --configuration "$env:CONFIGURATION" --no-restore

      # Keep documentation controls blocking when Linux compatibility is optional.
      - name: Generate and validate documentation
        run: |
          dotnet ./tools/PiratePDF.DocGen/bin/Release/net10.0/PiratePDF.DocGen.dll all
          if ($LASTEXITCODE -ne 0) { throw 'Documentation validation failed.' }
          dotnet ./tools/PiratePDF.DocGen/bin/Release/net10.0/PiratePDF.DocGen.dll health
          if ($LASTEXITCODE -ne 0) { throw 'Documentation health analysis failed.' }
          dotnet ./tools/PiratePDF.DocGen/bin/Release/net10.0/PiratePDF.DocGen.dll repair
          if ($LASTEXITCODE -ne 0) { throw 'Documentation repair preview failed.' }
          $report = Get-Content -LiteralPath ./docs/Document-Changes.md -Raw
          foreach ($metric in @('Changes', 'Files')) {
            $match = [regex]::Match($report, "(?im)^\s*\|\s*$metric\s*\|\s*(\d+)\s*\|\s*$")
            if (-not $match.Success -or [int]$match.Groups[1].Value -ne 0) {
              throw "Documentation repair preview has a missing or nonzero $metric count."
            }
          }

      # No desktop entry project exists yet. Do not publish a test/tool as the
      # application. PP-AUD-041 tracks missing distribution/startup qualification.

      # No platform filter: Windows runs every solution test, including both real symbolic-link fixtures.
      # Hosted Windows is expected to provide the privilege; fixture failure fails this job, never skips it.
      - name: Run all tests
        run: >
          dotnet test "$env:SOLUTION_PATH"
          --configuration "$env:CONFIGURATION" --no-build --no-restore
          --results-directory ./TestResults/windows --logger trx
          --logger "console;verbosity=normal"

      - name: Verify both fuzz test categories executed
        run: ./tests/PiratePDF.Fuzz.Tests/Test-PlatformCoverage.ps1 -ResultsDirectory ./TestResults/windows -Platform All

      - name: Bound failed test-result evidence
        id: windows_trx_bounds
        if: failure()
        run: ./tests/PiratePDF.Fuzz.Tests/Test-PlatformCoverage.ps1 -ResultsDirectory ./TestResults/windows -BoundsOnly

      - name: Retain failed test results
        if: failure() && steps.windows_trx_bounds.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: TestResults/windows/*.trx
          retention-days: 7
          if-no-files-found: warn

      - name: Verify repository cleanliness
        if: ${{ !cancelled() }}
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests modified tracked files.' }
          $unexpected = @(git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0 -or $unexpected.Count -ne 0) { throw 'Windows tests generated unexpected files.' }
